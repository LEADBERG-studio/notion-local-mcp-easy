# connections.cfg — сохранённые рабочие области для Notion Local MCP Easy
#
# MENU = on  -> при запуске показывать меню выбора рабочей области.
# MENU = off -> запускать сервер сразу с областью из C:\Users\nesanton\AppData\Local\NotionMcpEasy\config.json.
#
# PATH[n] — сохранённые варианты пути к рабочей области.
# Этот файл можно редактировать вручную в любом текстовом редакторе.
# Примеры:
# PATH[1] = C:\Users\you\Documents\project-one
# PATH[2] = D:\Work\project-two
#
# IDE_GATEWAY — секция для переноса настроек IDE Gateway между версиями.
# Копируйте этот блок при обновлении сервера, чтобы сохранить подключения.
# Значения можно переопределить через SETUP.bat (force mode).
#
# IDE_GATEWAY_API_KEY = ideg_xxx...     — ключ для подключения IDE
# IDE_GATEWAY_MODE = sandbox            — режим: sandbox | bridge | external
# IDE_GATEWAY_HOST = 127.0.0.1         — адрес: 127.0.0.1 (локально) | 0.0.0.0 (сеть/Docker)
# IDE_GATEWAY_PORT = 8787              — порт локального шлюза
# IDE_GATEWAY_PUBLIC_URL =             — публичный URL (Tunnellio, если есть)
#
